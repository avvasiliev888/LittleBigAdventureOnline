<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>red_warlord — боевой маг</title>
<style>
  body { margin: 0; padding: 32px; background: #14171d; color: #e6e8ec;
         font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: #8b93a1; margin-bottom: 28px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  figure { margin: 0; background: #1b1f27; border: 1px solid #262b35; border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 10px 14px; font-size: 13px; color: #9aa3b2; }
  figcaption b { color: #e6e8ec; font-weight: 600; }
  code { background: #232833; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <h1>red_warlord — боевой маг в красной зоне</h1>
  <div class="sub">
    Тело <code>WizardBodyMesh</code> (Battle Wizard), набор <code>magic</code>, рост 2,45.
    Кадры сняты из Unity без запуска игры: <code>Albion/Mobs/Render Mob Portraits</code>.
  </div>

  <div class="grid">
    <figure>
      <img src="red_warlord_idle.png" alt="Стойка">
      <figcaption><b>Idle01</b> — стойка, 1,33 с</figcaption>
    </figure>
    <figure>
      <img src="red_warlord_attack.png" alt="Удар">
      <figcaption><b>Attack01</b> — удар, 1,00 с. Магический жест двумя руками, не замах оружием</figcaption>
    </figure>
    <figure>
      <img src="red_warlord_hit.png" alt="Получение урона">
      <figcaption><b>GetHit</b> — получение урона, 1,00 с</figcaption>
    </figure>
    <figure>
      <img src="red_warlord_death.png" alt="Смерть">
      <figcaption><b>Die</b> — смерть, 0,83 с</figcaption>
    </figure>
  </div>
</body>
</html>
